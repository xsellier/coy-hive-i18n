  TOOLTIP_CANNOT_BUILD_MORE_HIVE_MAX: |
    Vous avez atteint le nombre maximal de ruche possible.
    Vous ne pouvez pas en construire plus.
  TOOLTIP_CANNOT_BUILD_MORE_HIVE: |
    Vous ne pouvez pas constriure plus de ruches pour le moment.

    Mais vous pouvez débloquer une nouvelle technologie qui va vous permettre de poser une ruche supplémentaire
  TOOLTIP_HARVEST_HONEY: |
    Cliquez sur ce bouton pour récolter tout le miel.

    Une fois récolté, tout le nectare de la rûche sera consommé.
    Il faut donc veiller a ce qu'elle ait suffisamment de sucre
    avant de récolter le miel.
  TOOLTIP_CANNOT_HARVEST_HONEY: |
    Soit il n'y a pas assez de nectare, soit les fleurs qui composent
    ce nectare ne feront pas un bon miel.
  TOOLTIP_HIVE_FULL_OF_HONEY: |
    La rûche est pleine de miel.

    Du coup les abeilles n'ont plus besoin de travailler.
    Vous pouvez soit aggrandir la rûche pour pouvoir stocker plus de miel,
    soit récolter le miel pour faire de la place.
  TOOLTIP_CANNOT_PLANT_SEED: |
    Vous [b]ne[/b] pouvez [b]pas[/b] encore planter des [pulse freq=1.0 color=#ffffff40 ease=-2.0][b]%ss[/b][/pulse].  Vous pourrez en planter dès [b]%s[/b].
  TOOLTIP_SHOW_TOOLTIP: |
    Montrer/cacher les infobulles
  TOOLTIP_SHOW_FLOWER_PANEL: |
    Montrer/cacher les panneaux des fleurs
  TOOLTIP_HIVE_SUGAR_FULL: |
    La ruche est pleine de sucre
  TOOLTIP_HIVE_BUY_SUGAR: |
    Acheter %0.2f kg de sucre pour %0.2f $
  TOOLTIP_NOT_ENOUGH_MONEY: |
    Pas assez d'argent
  TOOLTIP_HIVE_NO_HONEY_TO_HARVEST: |
    Pas de miel à récolter
  TOOLTIP_NO_HONEY: |
    Vous n'avez pas de miel.

    Pour en récolter, cliquez sur une rûche.
  TOOLTIP_CANNOT_BUY_NOT_ENOUGH_HONEY_OR_MONEY: |
    Vous n'avez pas assez de miel ou d'argent pour acheter ceci.
