  LABEL_NOTIFICATION_WEATHER_TOO_HOT_TO_LAY_EGG: |
    Votre rûche prend les dispositions pour survivre à la chaleur extrême.
    La reine prend les dispositions pour se préserver, et ne pond pas d'oeufs pour le moment.
  LABEL_NOTIFICATION_WEATHER_TOO_HOT_TO_WORK: |
    Il fait tellement chaud dehors, il serait trop dangereux pour les abeilles de sortir travailler.
    Elles vont rester au frais pour le moment.
  LABEL_NOTIFICATION_WEATHER_TOO_COLD_TO_WORK: |
    Il fait tellement froid dehors, il serait trop dangereux pour les abeilles de sortir travailler.
    Elles vont rester au chaud pour le moment.
  LABEL_NOTIFICATION_WEATHER_TOO_COLD_TO_LAY_EGG: |
    Vos abeilles prennent les dispositions pour survivre au froid polaire.
    La reine prend les dispositions pour se préserver, et ne pond pas d'oeufs pour le moment.
  LABEL_NOTIFICATION_WEATHER_TOO_WIND_TO_WORK: |
    Il y a trop de vent pour travailler. Les abeilles ne parviendraient pas a s'orienter.
    Elles vont rester au chaud pour le moment.
  LABEL_NOTIFICATION_WEATHER_TOO_RAINY_TO_WORK: |
    Il y a trop de pluie pour travailler. Les abeilles ne parviendraient pas a voler.
    Elles vont rester au chaud pour le moment.
  LABEL_NOTIFICATION_HIVE_FULL_OF_POLLEN: |
    Vos abeilles ont bien travaillées.
    Il est temps de récolter le pollen.
  LABEL_NOTIFICATION_HIVE_FULL_OF_HONEY: |
    Vos abeilles ont bien travaillées.
    Il est temps de récolter le miel.
  LABEL_NOTIFICATION_HIVE_NEED_SUGAR: |
    Vos abeilles ont faim, vous devriez leur donner un peu de sucre.
  LABEL_NOTIFICATION_HIVE_NO_FLOWER_TO_HARVEST: |
    Vos abeilles ne trouvent pas de fleur a butiner.
    Peut-être devriez-vous en planter.
  LABEL_NOTIFICATION_NO_MORE_SUGAR: |
    Il n'y a plus de sucre dans les entrepots !

