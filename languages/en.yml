  TOOLTIP_CANNOT_BUILD_MORE_HIVE_MAX: |
    You have reached the maximum number of hives.
    You cannot build any more.
  TOOLTIP_CANNOT_BUILD_MORE_HIVE: |
    You cannot build any more hives for now.

    But you can unlock a new technology that will allow you to place an additional hive.
  TOOLTIP_HARVEST_HONEY: |
    Click this button to harvest all the honey.

    Once harvested, all the nectar in the hive will be consumed.
    You should make sure the hive has enough sugar
    before harvesting the honey.
  TOOLTIP_CANNOT_HARVEST_HONEY: |
    Either there is not enough nectar, or the flowers that make up
    this nectar will not make good honey.
  TOOLTIP_HIVE_FULL_OF_HONEY: |
    The hive is full of honey.

    So the bees no longer need to work.
    You can either expand the hive to store more honey,
    or harvest the honey to make room.
