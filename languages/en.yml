  LABEL_NOTIFICATION_WEATHER_TOO_HOT_TO_LAY_EGG: |
    Your hive is making arrangements to survive the extreme heat.
    The queen is taking measures to preserve herself, and is not laying eggs for the moment.
  LABEL_NOTIFICATION_WEATHER_TOO_HOT_TO_WORK: |
    It's so hot outside, it would be too dangerous for the bees to go out to work.
    They will stay cool for now.
  LABEL_NOTIFICATION_WEATHER_TOO_COLD_TO_WORK: |
    It's so cold outside, it would be too dangerous for the bees to go out to work.
    They will stay warm for now.
  LABEL_NOTIFICATION_WEATHER_TOO_COLD_TO_LAY_EGG: |
    Bees are making arrangements to survive the polar cold.
    The queen is taking measures to preserve herself, and is not laying eggs for the moment.
  LABEL_NOTIFICATION_WEATHER_TOO_WIND_TO_WORK: |
    There's too much wind to work. The bees wouldn't be able to orient themselves.
    They will stay warm for now.
  LABEL_NOTIFICATION_WEATHER_TOO_RAINY_TO_WORK: |
    There's too much rain to work. The bees wouldn't be able to fly.
